name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/shared/**"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/shared/**"
  release:
    types: [published]
  workflow_run:
    workflows: ["Sync from OpenClaw upstream"]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-apk:
    name: Build ${{ github.event.inputs.build_type || 'debug' }} APK
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build APK
        working-directory: apps/android
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleRelease
          else
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: apps/android/app/build/outputs/apk/${{ github.event.inputs.build_type || 'debug' }}/*.apk
          retention-days: 30
          if-no-files-found: error
